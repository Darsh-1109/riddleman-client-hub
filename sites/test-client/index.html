<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Client — Riddleman Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f7f8ff, #eef2ff);
      color: #172033;
    }
    .card {
      width: min(680px, calc(100% - 40px));
      padding: 56px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 20px 60px rgba(30, 45, 90, .12);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #eef1ff;
      color: #3d4c9a;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    h1 { margin: 22px 0 12px; font-size: clamp(32px, 6vw, 54px); }
    p { margin: 0; color: #667085; font-size: 18px; line-height: 1.6; }
    .url {
      margin-top: 28px;
      padding: 14px 18px;
      border-radius: 12px;
      background: #f7f8fa;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Deployment Test</span>
    <h1>It works 🚀</h1>
    <p>This is a dummy client website deployed through the Riddleman Client Hub.</p>
    <div class="url">hub.riddlemantech.com/test-client/</div>
  </main>
</body>
</html>
